<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore - Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<header>
    <nav>
        <a href="index.html" class="logo">MyStore</a>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="products-page">

        <h1>All Products</h1>

        <div class="filters">

            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search products..."
            >

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="accessories">Accessories</option>
            </select>

        </div>

        <div id="productsContainer">
            <!-- Products will be added with JavaScript -->
        </div>

    </section>

</main>

<footer>
    <p>&copy; 2026 MyStore. All rights reserved.</p>
</footer>

<script src="scripts/product-data.js" type="module"></script>
<script src="scripts/product-code.js" type="module"></script>

</body>
</html>
